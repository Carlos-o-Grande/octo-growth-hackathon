<!doctype html><html lang="en"><head><meta charset="utf-8"><title>li-task-message</title><style>
@font-face{font-family:Inter;font-weight:400;src:url('../../../../website/landing/fonts/Inter-Regular.ttf')}
@font-face{font-family:Inter;font-weight:500;src:url('../../../../website/landing/fonts/Inter-Medium.ttf')}
@font-face{font-family:Inter;font-weight:600;src:url('../../../../website/landing/fonts/Inter-SemiBold.ttf')}
@font-face{font-family:'Geist Mono';font-weight:500;src:url('../../../../website/landing/fonts/GeistMono-Medium.ttf')}
*{box-sizing:border-box}
html,body{margin:0;width:1200px;height:1200px;overflow:hidden;background:#0D0818}
.frame{position:relative;width:1200px;height:1200px;overflow:hidden;color:#F3EEFB;font-family:Inter,sans-serif;
  -webkit-font-smoothing:antialiased;
  background:linear-gradient(180deg,#0D0818 0%,#120626 55%,#1A0033 100%)}
.glow{position:absolute;border-radius:50%;pointer-events:none;
  background:radial-gradient(closest-side,rgba(63,0,127,0.62),rgba(63,0,127,0.22) 55%,rgba(63,0,127,0) 100%)}
.grain{position:absolute;inset:0;opacity:0.03;background-image:url("data:image/svg+xml;utf8,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20width%3D'240'%20height%3D'240'%3E%3Cfilter%20id%3D'n'%3E%3CfeTurbulence%20type%3D'fractalNoise'%20baseFrequency%3D'0.9'%20numOctaves%3D'2'%20stitchTiles%3D'stitch'%2F%3E%3CfeColorMatrix%20type%3D'saturate'%20values%3D'0'%2F%3E%3C%2Ffilter%3E%3Crect%20width%3D'100%25'%20height%3D'100%25'%20filter%3D'url(%23n)'%2F%3E%3C%2Fsvg%3E");background-size:240px 240px;pointer-events:none}
.content{position:absolute;display:flex;flex-direction:column}
.label{font-family:'Geist Mono',monospace;font-weight:500;font-size:26px;letter-spacing:0.14em;text-transform:uppercase;color:#9A8FAE;line-height:1.3}
.lead{font-weight:400;font-size:42px;line-height:1.3;color:#CBC0DD;letter-spacing:-0.01em}
.headline{font-weight:600;font-size:116px;line-height:1.02;letter-spacing:-0.03em;margin:0;color:#F3EEFB}
.lime{color:#C4E833}
.shot{position:relative}
.window{position:relative;border-radius:27px;overflow:hidden;border:1px solid rgba(255,255,255,0.12);
  box-shadow:0 44px 133px rgba(0,0,0,0.5);background:#202124}
.window .img{width:100%;background-repeat:no-repeat}
.window::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.10);background:linear-gradient(180deg,rgba(255,255,255,0.035),rgba(255,255,255,0) 18%)}
.caption{margin-top:27px}
.pose{position:absolute;background-repeat:no-repeat;z-index:3}
.hair{height:1px;background:rgba(255,255,255,0.12)}
</style></head>
<body><div class="frame">
<div class="glow" style="width:1500px;height:1500px;left:234px;top:-558px"></div>
<div class="content" data-role="content" style="left:104px;right:104px;top:104px;bottom:104px">
  
  <div class="lead" data-text>The most useful thing our AI teammate does isn’t on the call.</div><div style="height:22px"></div>
  <h1 class="headline" data-text data-head>It’s the message after.</h1>
  
  <div style="flex:1;min-height:217px"></div>
  <div class="shot" style="width:860px">
    <div class="pose" data-role="pose" style="width:220px;height:202px;
    background-image:url('../../../../../assets/octo-poses/05-look-left.png');background-size:430px auto;
    background-position:-106px -122px;right:44px;bottom:calc(100% - 12px)"></div>
    <div class="window" data-role="window"><div class="img" style="aspect-ratio:910/392;
    background-image:url('../../../../../assets/screenshots/octo-tile-captured.png');background-size:210.989% auto;

</div><div class="grain"></div></div></body></html>
